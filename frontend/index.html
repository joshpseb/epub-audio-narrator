<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var __t = localStorage.getItem("epub-audio-narrator.theme.v1");
        if (__t === "dark" || __t === "light") document.documentElement.dataset.theme = __t;
      } catch (_) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPUB Audio Narrator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
