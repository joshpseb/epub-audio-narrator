[project]
name = "epub-audio-narrator-backend"
version = "0.1.0"
description = "Local EPUB to multilingual audiobook backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "ebooklib",
  "beautifulsoup4",
  "lxml",
  "lingua-language-detector",
  "kokoro-onnx",
  "google-cloud-texttospeech",
  "python-multipart",
  "pydantic>=2",
  "mutagen>=1.47,<2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
